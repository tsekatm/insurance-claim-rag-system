name: deploy-dev

# Push to main → quality gate → plan (🛑 approval) → apply the reviewed plan + post-apply tests (🛑 approval).
# Applies claims-rag-storage and claims-rag-iam only. claims-rag-ci is applied by hand with elevated
# credentials (the CI role must never modify itself).
on:
  push:
    branches: [main]
    paths:
      - "terraform/claims-rag-storage/**"
      - "terraform/claims-rag-iam/**"
      - "tests/deployment/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never cancel a running apply

env:
  TF_FOLDERS: "claims-rag-storage claims-rag-iam" # apply order
  TF_IN_AUTOMATION: "true"

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: quality
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: config parity — GitHub vars must match committed tfvars
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          set -euo pipefail
          for d in claims-rag-iam claims-rag-ci; do
            f="terraform/$d/environments/dev.tfvars"
            grep -Eq "^tf_state_bucket *= *\"$TF_STATE_BUCKET\"" "$f" || { echo "::error::$f tf_state_bucket != vars.TF_STATE_BUCKET"; exit 1; }
            grep -Eq "^tf_state_region *= *\"$TF_STATE_REGION\"" "$f" || { echo "::error::$f tf_state_region != vars.TF_STATE_REGION"; exit 1; }
          done
      - id: plan
        name: terraform plan (all folders)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          : > digests.txt
          for d in $TF_FOLDERS; do
            terraform -chdir="terraform/$d" init -input=false \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=insurance-claim-rag-system/$d/terraform.tfstate" \
              -backend-config="region=$TF_STATE_REGION" \
              -backend-config="use_lockfile=true" \
              -backend-config="encrypt=true" \
              -backend-config="kms_key_id=arn:aws:kms:$TF_STATE_REGION:$account:alias/terraform-state"
            terraform -chdir="terraform/$d" plan -input=false -var-file=environments/dev.tfvars -out=tfplan
            {
              echo "### $d"
              echo '```'
              terraform -chdir="terraform/$d" show -no-color tfplan
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Digest of the planned changes only (not the plan file, which embeds state) — apply must match it.
            terraform -chdir="terraform/$d" show -json tfplan | jq -cS '.resource_changes // []' | sha256sum | cut -d' ' -f1 \
              | sed "s/^/$d=/" >> digests.txt
          done
          echo "digest=$(sha256sum digests.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev # second approval: the reviewer has read the plan in the plan job's summary
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: re-plan, verify it matches the reviewed plan, apply
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
          REVIEWED_DIGEST: ${{ needs.plan.outputs.plan_digest }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          init() {
            terraform -chdir="terraform/$1" init -input=false \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=insurance-claim-rag-system/$1/terraform.tfstate" \
              -backend-config="region=$TF_STATE_REGION" \
              -backend-config="use_lockfile=true" \
              -backend-config="encrypt=true" \
              -backend-config="kms_key_id=arn:aws:kms:$TF_STATE_REGION:$account:alias/terraform-state"
          }
          : > digests.txt
          for d in $TF_FOLDERS; do
            init "$d"
            terraform -chdir="terraform/$d" plan -input=false -var-file=environments/dev.tfvars -out=tfplan
            terraform -chdir="terraform/$d" show -json tfplan | jq -cS '.resource_changes // []' | sha256sum | cut -d' ' -f1 \
              | sed "s/^/$d=/" >> digests.txt
          done
          actual="$(sha256sum digests.txt | cut -d' ' -f1)"
          if [ "$actual" != "$REVIEWED_DIGEST" ]; then
            echo "::error::Planned changes differ from the reviewed plan — re-run the workflow and review again."
            exit 1
          fi
          for d in $TF_FOLDERS; do
            terraform -chdir="terraform/$d" apply -input=false tfplan
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements.txt "$(grep "^pytest==" requirements-dev.txt)"
      - name: post-apply tests (fail on any skip)
        env:
          REQUIRE_DEPLOYMENT_CHECKS: "1" # missing credentials/config is a failure, never a skip
          ENVIRONMENT: dev
        run: |
          set -euo pipefail
          pytest tests/deployment -m deployment -p no:cacheprovider -o addopts="" -rs \
            --junitxml=tests/reports/junit-deployment.xml | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then echo "::error::skipped tests in a deployment gate"; exit 1; fi
